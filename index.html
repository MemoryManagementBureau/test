<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0b0b0d;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;

  /* 顶部官方账号 */
  .top-account {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
    background: rgba(11, 11, 13, 0.9);
    color: #ff7a30;
    font-size: 13px;
    padding: 10px 0;
    z-index: 100;
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,122,48,0.3);
    letter-spacing: 1px;
  }

  /* 背景漂浮 emoji */
  .floaters { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .floaters span {
    position: absolute;
    font-size: 24px;
    opacity: 0.15;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    from { transform: translateY(110vh) rotate(0deg); }
    to   { transform: translateY(-20vh) rotate(360deg); }
  }

  .app {
    width: 100%;
    max-width: 440px;
    background: #1a1a1e;
    border: 1px solid #2a2a30;
    border-radius: 24px;
    padding: 24px 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  .screen { display: none; animation: pop .3s ease both; }
  .screen.active { display: block; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 开始页 */
  .hero { text-align: center; padding: 10px 0; }
  .hero h1 { font-size: 24px; color: #ff7a30; margin: 0 0 8px; letter-spacing: 2px; }
  .hero p { color: #888; font-size: 13px; line-height: 1.8; margin: 0 0 24px; }
  .hero-tag {
    display: inline-block;
    background: rgba(255,122,48,0.15);
    color: #ff7a30;
    border: 1px solid rgba(255,122,48,0.3);
    padding: 4px 12px;
    border-radius: 99px;
    font-size: 12px;
    margin-bottom: 16px;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, #ff9a44, #ff5e00);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .2s;
    box-shadow: 0 8px 24px rgba(255,94,0,0.3);

  .btn:active { transform: scale(.97); }

  /* 答题页 */
  .progress-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .progress-track { flex: 1; height: 6px; background: #2a2a30; border-radius: 99px; overflow: hidden; }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ff9a44, #ff5e00);
    border-radius: 99px; transition: width .3s ease;

  .progress-num { font-size: 12px; color: #666; min-width: 40px; text-align: right; }

  .q-text { font-size: 18px; font-weight: 700; line-height: 1.6; margin: 0 0 18px; color: #eee; }

  .option {
    display: block; width: 100%; text-align: left;
    padding: 14px 16px; margin: 10px 0;
    border-radius: 12px;
    background: #232328; border: 1px solid #2e2e35;
    color: #ccc; font-size: 14.5px; line-height: 1.5;

  .option:active { background: #2e2e35; border-color: #ff7a30; color: #fff; transform: scale(.98); }
  .option.picked { background: rgba(255,122,48,0.15); border-color: #ff7a30; color: #fff; }

  /* 结果页 */
  .result-header { text-align: center; margin-bottom: 20px; }
  .result-emoji {
    font-size: 64px; line-height: 1; margin-bottom: 12px;
    animation: bounceIn .5s cubic-bezier(.2,1.5,.5,1) both;

  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-30deg); opacity: 0; }

  .result-name { font-size: 24px; font-weight: 800; color: #ff7a30; margin-bottom: 6px; }
  .result-tag {
    font-size: 13px; color: #888; background: #232328;
    display: inline-block; padding: 4px 14px; border-radius: 99px;
  }
  .result-desc {
    background: #232328; border-left: 3px solid #ff7a30;
    border-radius: 0 12px 12px 0; padding: 16px;
    font-size: 14px; line-height: 1.8; color: #bbb; margin: 20px 0;
  }

  /* 评论区 */
  .comments { margin: 16px 0; }
  .comments-title {
    font-size: 12px; color: #666; letter-spacing: 2px; margin-bottom: 10px;
  }
  .comment {
    display: flex; gap: 10px;
    padding: 10px 12px; background: #232328;
    border-radius: 12px; margin-bottom: 8px;
    font-size: 13px; line-height: 1.6;
    animation: pop .3s ease both;
  }
  .comment .c-emoji { flex-shrink: 0; font-size: 16px; }
  .comment .c-text { color: #bbb; }

  /* 灼石彩蛋专属 */
  .egg-box {
    background: #111;
    border: 1px dashed #555;
    border-radius: 12px;
    padding: 16px;
    margin: 16px 0;
    text-align: center;
    display: none;
  }
  .egg-box.show { display: block; animation: pop .5s ease both; }
  .egg-box p {
    margin: 6px 0; font-size: 14px; color: #aaa; font-family: monospace;
  }
  .egg-box p span { color: #ff7a30; }

  /* 结果进度条 */
  .bars-title {
    font-size: 12px; color: #666; letter-spacing: 2px; margin-bottom: 10px;
  }
  .bar-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px; font-size: 12px;
  }
  .bar-label { width: 72px; flex-shrink: 0; color: #999; }
  .bar-track { flex: 1; height: 8px; background: #2a2a30; border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; border-radius: 99px; transition: width .8s cubic-bezier(.2,.9,.3,1); }
  .bar-pct {
    width: 34px; text-align: right; color: #666;
    font-variant-numeric: tabular-nums;
  }

  .actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-ghost {
    flex: 1; padding: 14px; border-radius: 12px;
    border: 1px solid #333; background: transparent;
    color: #aaa; font-size: 14px; font-family: inherit; cursor: pointer;
  }
  .btn-ghost:active { background: #232328; }
</style>
</head>

      { t: '觉得花1块钱买这瓶水，挺值的', k: 'orange' },
      { t: '喷火，然后被消防队带走', k: 'hotpot' },
      { t: '你看着空瓶，脑海中一片空白。你不记得水是什么味道，不记得自己是谁，也不记得刚才发生了什么。', k: 'stone' }
    ]
  }
];

/* ============ 状态 ============ */
let idx = 0;
const scores = { peach: 0, blueberry: 0, grape: 0, apple: 0, orange: 0, hotpot: 0, stone: 0 };

/* ============ 元素 ============ */
const startScreen  = document.getElementById('start-screen');
const quizScreen   = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');
const progressFill = document.getElementById('progress-fill');
const progressNum  = document.getElementById('progress-num');
const qText        = document.getElementById('q-text');
const optionsEl    = document.getElementById('options');
const eggBox       = document.getElementById('egg-box');
const commentsBox  = document.getElementById('comments');
const commentList  = document.getElementById('comment-list');

/* ============ 屏幕切换 ============ */
function showScreen(el) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
}

/* ============ 渲染题目 ============ */
function renderQuestion() {
  const q = questions[idx];
  progressFill.style.width = ((idx) / questions.length * 100) + '%';
  progressNum.textContent = (idx + 1) + ' / ' + questions.length;
  qText.textContent = q.q;
  optionsEl.innerHTML = '';

  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.t;
    btn.onclick = () => choose(opt.k, btn);
    optionsEl.appendChild(btn);
  });
}

/* ============ 选择答案 ============ */
let locked = false;
function choose(key, btn) {
  if (locked) return;
  locked = true;

  scores[key]++;
  btn.classList.add('picked');
  optionsEl.querySelectorAll('.option').forEach(b => b.disabled = true);
  progressFill.style.width = ((idx + 1) / questions.length * 100) + '%';

  setTimeout(() => {
    idx++;
    locked = false;
    if (idx < questions.length) {
      renderQuestion();
      quizScreen.style.animation = 'none';
      void quizScreen.offsetWidth;
      quizScreen.style.animation = '';
    } else {
      showResult();
    }
  }, 340);
}

/* ============ 结果 ============ */
function showResult() {
  const keys = ['peach', 'blueberry', 'grape', 'apple', 'orange', 'hotpot'];
  const max = Math.max(...keys.map(k => scores[k]));
  const top = keys.filter(k => scores[k] === max);

  // 灼石彩蛋：只有当灼石得分严格高于所有普通口味时才触发
  const stoneScore = scores.stone;
  let winner;
  if (stoneScore > max) {
    winner = 'stone';
  } else {
    winner = top[Math.floor(Math.random() * top.length)];
  }

  const data = TYPES[winner];

  document.getElementById('r-emoji').textContent = data.emoji;
  document.getElementById('r-name').textContent = data.name;
  document.getElementById('r-tag').textContent = '「 ' + data.tag + ' 」';
  document.getElementById('r-desc').textContent = data.desc;

  // 灼石彩蛋
  if (winner === 'stone') {
    eggBox.classList.add('show');
    commentsBox.style.display = 'none';
  } else {
    eggBox.classList.remove('show');
    commentsBox.style.display = 'block';
    renderComments(data.comments);
  }

  // 成分条（不包含 stone）
  renderBars(keys);

  showScreen(resultScreen);
}

/* ============ 渲染评论 ============ */
function renderComments(comments) {
  commentList.innerHTML = '';
  comments.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'comment';
    div.style.animationDelay = (i * 0.08) + 's';
    div.innerHTML = '<span class="c-emoji">' + c.e + '</span><span class="c-text">' + c.t + '</span>';
    commentList.appendChild(div);
  });
}

/* ============ 渲染成分条 ============ */
function renderBars(keys) {
  const barsEl = document.getElementById('bars');
  barsEl.innerHTML = '';

  keys.forEach(k => {
    const t = TYPES[k];
    const pct = Math.round(scores[k] / questions.length * 100);
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML =
      '<span class="bar-label">' + t.emoji + ' ' + t.name + '</span>' +
      '<div class="bar-track"><div class="bar-fill" data-w="' + pct + '" ' +
      'style="background:' + t.color + '"></div></div>' +
      '<span class="bar-pct">' + pct + '%</span>';
    barsEl.appendChild(row);
  });

  setTimeout(() => {
    barsEl.querySelectorAll('.bar-fill').forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
  }, 120);
}

/* ============ 重置 ============ */
function reset() {
  idx = 0;
  locked = false;
  Object.keys(scores).forEach(k => scores[k] = 0);
  progressFill.style.width = '0%';
  eggBox.classList.remove('show');
  commentsBox.style.display = 'block';
  commentList.innerHTML = '';
  showScreen(startScreen);
}

/* ============ 事件绑定 ============ */
document.getElementById('start-btn').onclick = () => {
  reset();
  renderQuestion();
  showScreen(quizScreen);
};
document.getElementById('again-btn').onclick = reset;

/* ============ 背景漂浮 emoji ============ */
(function makeFloaters() {
  const box = document.getElementById('floaters');
  const emojis = ['❤️', '♟️', '⚡', '☁️'];
  for (let i = 0; i < 24; i++) {
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + '%';
    s.style.fontSize = (16 + Math.random() * 24) + 'px';
    s.style.animationDuration = (12 + Math.random() * 18) + 's';
    s.style.animationDelay = (-Math.random() * 30) + 's';
    box.appendChild(s);
  }
})();
</script>
</body>
